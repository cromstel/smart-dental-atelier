name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The port the suite runs against. Every URL below derives from it, so the
# number exists in exactly one place.
env:
  PORT: 4040
  APP_NAME: dental-atelier

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The name matches a required status check on the protected branch. It is
    # kept deliberately: renaming it would block every pull request.
    name: Lint, build and test
    runs-on: ubuntu-latest

    services:
      # MySQL for the build's static generation and the smoke test.
      # `prisma migrate deploy` needs CREATE DATABASE for its shadow database,
      # so the service user is granted global rights rather than schema-only.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smart_dental_atelier
          MYSQL_USER: smart_dental_atelier
          MYSQL_PASSWORD: smart_dental_atelier
          MYSQL_ROOT_PASSWORD: root_change_me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_change_me"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    # The `env` context is not available here (GitHub allows only github,
    # needs, strategy, matrix, vars, secrets and inputs at job level), so
    # this block holds literals only. The values that derive from PORT are
    # attached to the steps that need them, where `env.PORT` does resolve.
    env:
      DATABASE_URL: mysql://smart_dental_atelier:smart_dental_atelier@127.0.0.1:3306/smart_dental_atelier
      NEXTAUTH_SECRET: ci-only-secret-not-used-anywhere-real
      ADMIN_EMAIL: ci@dentalatelier.local
      ADMIN_PASSWORD: CiAdminPassword-2026

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Prisma 7 requires Node 20.19+ / 22.12+ / 24+.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Grants CREATE DATABASE to the service user, which `prisma migrate dev`
      # requires for its shadow database.
      - name: Allow the service user to create databases
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot_change_me <<'SQL'
            GRANT ALL PRIVILEGES ON *.* TO 'smart_dental_atelier'@'%';
            FLUSH PRIVILEGES;
          SQL

      - name: Verify the Prisma schema
        run: npx prisma validate

      - name: Check formatting of generated artefacts
        run: npx prisma format --check

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # The test suite is local-only (see .gitignore): it is never committed,
      # never pushed, and never part of the production image. The step runs
      # anyway *if* a suite is present - a fork or a deliberate push - and is
      # skipped otherwise, so CI stays honest about what it verified.
      - name: Unit and API tests
        if: ${{ hashFiles('tests/**') != '' }}
        run: npm run test:ci -- --ci --coverage

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed content
        env:
          APP_NAME: ${{ env.APP_NAME }}
        run: npm run db:seed

      - name: Build
        env:
          APP_NAME: ${{ env.APP_NAME }}
          NEXT_PUBLIC_APP_NAME: ${{ env.APP_NAME }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:${{ env.PORT }}
        run: npm run build

      - name: Smoke-test the production server
        env:
          APP_NAME: ${{ env.APP_NAME }}
          NEXT_PUBLIC_APP_NAME: ${{ env.APP_NAME }}
          NEXTAUTH_URL: http://127.0.0.1:${{ env.PORT }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:${{ env.PORT }}
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:$PORT/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          curl -sf http://127.0.0.1:$PORT/api/health | grep -q '"database":"ok"'
          for path in / /about-us /services /faqs /contact-us /portfolio /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          # Admin surfaces must not be crawlable.
          curl -s -D - -o /dev/null http://127.0.0.1:$PORT/admin | grep -qi 'x-robots-tag: noindex'

  e2e:
    # Also a required status check on the protected branch; the name is kept
    # for the same reason. The suite itself is local-only, so the job reports
    # that there is nothing to run - and does run it, if a suite is present.
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: verify

    services:
      # The suite needs a reachable database for the admin and portal flows.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smart_dental_atelier
          MYSQL_USER: smart_dental_atelier
          MYSQL_PASSWORD: smart_dental_atelier
          MYSQL_ROOT_PASSWORD: root_change_me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_change_me"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: mysql://smart_dental_atelier:smart_dental_atelier@127.0.0.1:3306/smart_dental_atelier
      NEXTAUTH_SECRET: ci-only-secret-not-used-anywhere-real
      ADMIN_EMAIL: ci@dentalatelier.local
      ADMIN_PASSWORD: CiAdminPassword-2026

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Prisma 7 requires Node 20.19+ / 22.12+ / 24+.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The gate comes first: without a local suite there is nothing to set
      # up, and every step below is skipped anyway.
      - name: Check for a local end-to-end suite
        id: suite
        run: npm run test:e2e

      - name: Generate the Prisma client, migrate and seed
        if: ${{ hashFiles('tests/e2e/**') != '' }}
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright browsers
        if: ${{ hashFiles('tests/e2e/**') != '' }}
        run: npx playwright install --with-deps chromium

      - name: Build
        if: ${{ hashFiles('tests/e2e/**') != '' }}
        env:
          APP_NAME: ${{ env.APP_NAME }}
          NEXT_PUBLIC_APP_NAME: ${{ env.APP_NAME }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:${{ env.PORT }}
        run: npm run build

      # webServer in playwright.config.js runs `npm start`, which binds $PORT.
      - name: Run the E2E suite
        if: ${{ hashFiles('tests/e2e/**') != '' }}
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure() && hashFiles('tests/e2e/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7