# Kubernetes manifests.
#
# The application name and the listen port are NOT written here — they are
# substituted from the environment, so one set of manifests serves any
# deployment:
#
#   1. cp k8s/secret.example.yaml k8s/secret.yaml   # fill in, never commit
#   2. export APP_NAME=... PORT=... SITE_URL=... INGRESS_HOST=...
#   3. envsubst < k8s/deployment.yaml | kubectl apply -f -
#
# `${APP_NAME}` and `${PORT}` are expanded by `envsubst`; the values come from
# the same `.env` the app itself reads.
#
# The database is expected to be managed externally (PlanetScale / RDS / your
# own MySQL); it is deliberately not defined here.

apiVersion: v1
kind: Namespace
metadata:
  name: ${APP_NAME}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APP_NAME}-config
  namespace: ${APP_NAME}
data:
  APP_NAME: '${APP_NAME}'
  NEXT_PUBLIC_APP_NAME: '${APP_NAME}'
  NEXTAUTH_URL: '${SITE_URL}'
  NEXT_PUBLIC_SITE_URL: '${SITE_URL}'
  NODE_ENV: 'production'
  # The listen port. Substituted from the environment, like every other value.
  PORT: '${PORT}'
  DEBUG_MODE: 'false'
  # Extra origins allowed to POST to the public forms, comma separated.
  # Empty means same-origin only.
  ALLOWED_ORIGINS: ''
  # Mail transport. The credentials live in the Secret, not here.
  SMTP_PROVIDER: ''
  SMTP_HOST: ''
  SMTP_PORT: ''
  SMTP_FROM: ''
  NOTIFY_EMAIL: ''
  # Where the transcoded gallery images are written.
  GALLERY_STORAGE_DIR: 'public/uploads'
  # The studio's schedule.
  APPOINTMENT_TIME_ZONE: ''
  APPOINTMENT_DURATION_MINUTES: ''
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAME}
  labels:
    app.kubernetes.io/name: ${APP_NAME}
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ${APP_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/your-org/${APP_NAME}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${PORT}
          envFrom:
            - configMapRef:
                name: ${APP_NAME}-config
            # DATABASE_URL, NEXTAUTH_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD,
            # SMTP_USER, SMTP_PASSWORD, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
            - secretRef:
                name: ${APP_NAME}-secrets
          # Prisma needs a writable tmp for its engine extraction.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Admin gallery uploads must survive a pod replacement.
            - name: uploads
              mountPath: /app/public/uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          # Readiness gates traffic; liveness restarts a wedged pod.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: tmp
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: ${APP_NAME}-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAME}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${APP_NAME}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# TLS is terminated here; cert-manager annotates the Ingress to issue it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAME}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: '8m'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['${INGRESS_HOST}']
      secretName: ${APP_NAME}-tls
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${APP_NAME}
                port:
                  name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP_NAME}-uploads
  namespace: ${APP_NAME}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
# Scale to zero on a schedule. Booking data lives in MySQL, so a scale-down only
# costs the first request's cold start.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAME}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${APP_NAME}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # A patient booking form is not a latency-sensitive path; avoid flapping.
      stabilizationWindowSeconds: 300