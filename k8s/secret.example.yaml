# Template only — copy to `secret.yaml`, fill in the real values and keep
# `secret.yaml` out of version control (it is already in .gitignore).
#
#   openssl rand -base64 32      # for NEXTAUTH_SECRET
#
# Prefer an external secret manager in production (External Secrets Operator,
# Sealed Secrets, or your cloud provider's CSI driver) and replace this file
# entirely with a SecretStore reference.

apiVersion: v1
kind: Secret
metadata:
  name: dental-atelier-secrets
  namespace: dental-atelier
type: Opaque
stringData:
  # Managed MySQL, not a cluster-internal host.
  DATABASE_URL: 'mysql://dental_atelier:CHANGE_ME@mysql.example.com:3306/smart_dental_atelier'
  # openssl rand -base64 32
  NEXTAUTH_SECRET: 'CHANGE_ME_generate_a_32_byte_secret'
  ADMIN_EMAIL: 'michal@dentalatelier.co'
  # Only used by `npm run db:seed`. Remove it from the running Deployment's
  # secret once the admin account exists.
  ADMIN_PASSWORD: 'CHANGE_ME'
  # Optional Google OAuth (both must be set to enable the provider).
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''