apiVersion: v1
kind: Secret
metadata:
  name: ${APP_NAME}-secrets
  namespace: ${APP_NAME}
type: Opaque
stringData:
  # Managed MySQL, not a cluster-internal host.
  # The password must be percent-encoded (`/` becomes `%2F`).
  DATABASE_URL: 'mysql://USER:PASSWORD@mysql.example.com:3306/DB_NAME'
  # openssl rand -base64 32
  NEXTAUTH_SECRET: 'CHANGE_ME_generate_a_32_byte_secret'
  # The studio's administrator account.
  ADMIN_EMAIL: 'CHANGE_ME_admin@example.com'
  # Only used by `npm run db:seed`. Remove it from the running Deployment's
  # secret once the admin account exists.
  ADMIN_PASSWORD: 'CHANGE_ME'
  # Mail transport. Leave the pair empty to keep notifications in the log.
  # For Gmail, use an app password, not the account password.
  SMTP_USER: ''
  SMTP_PASSWORD: ''
  # Optional Google OAuth (both must be set to enable the provider).
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
